# Exact versions for the VPS venv (uv pip compile, linux x86_64, Python 3.12).
# requirements.txt lists what the bot asks for; this file is what a rebuild
# needs to get the same set back:
#   uv venv --relocatable .venv --python 3.12 && uv pip sync --python .venv/bin/python requirements.lock
# Regenerate: uv pip compile <inputs> --python-version 3.12 --python-platform x86_64-unknown-linux-gnu -o requirements.lock
#
# jobquest: the original wheel (/tmp/jobquest-0.1.12-py3-none-any.whl) is gone.
# Its 14 source files are identical to this commit of github.com/alwinpaul1/JobQuest
# (checked file by file, 2026-10-23), so it installs from there.
# setuptools stays 80.9.0: APScheduler 3.6.3 (hard-pinned by python-telegram-bot
# 13.13) imports pkg_resources, which setuptools 81 removed. Its open advisory
# (PYSEC-2026-3447) only affects building sdists, which the VPS never does.
